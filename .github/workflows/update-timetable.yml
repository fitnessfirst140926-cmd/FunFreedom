name: Update Fitness First timetable

on:
  schedule:
    - cron: '30 0 * * *'   # 8:30am SGT daily
  workflow_dispatch:        # lets you trigger it manually too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Scrape timetable
        env:
          FF_EMAIL: ${{ secrets.FF_EMAIL }}
          FF_PASSWORD: ${{ secrets.FF_PASSWORD }}
        run: python3 scrape_timetable.py

      - name: Rebuild app
        run: python3 build_app.py

      - name: Commit updated data + app
        run: |
          git config user.name "timetable-bot"
          git config user.email "actions@users.noreply.github.com"
          git add classes.json classes_min.json docs/index.html
          git diff --quiet --cached || git commit -m "Weekly timetable refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
